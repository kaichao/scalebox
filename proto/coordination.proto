syntax = "proto3";

package scalebox;

option go_package="./;scalebox";
option java_multiple_files = true;
option java_package = "net.scalebox.gprc";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ===== CoordinationService =====
// 分布式协调原语：Semaphore / Variable / Global / Queue
// Semagroup 也将归入此 Service（后续迁移）

service CoordinationService {
  rpc GetSemaphore(GetSemaphoreRequest) returns (GetSemaphoreResponse);
  rpc ListSemaphores(ListSemaphoresRequest) returns (ListSemaphoresResponse);
  rpc CreateSemaphore(CreateSemaphoreRequest) returns (CreateSemaphoreResponse);
  rpc UpdateSemaphore(UpdateSemaphoreRequest) returns (UpdateSemaphoreResponse);
  rpc DeleteSemaphore(DeleteSemaphoreRequest) returns (google.protobuf.Empty);
  rpc GetVariable(GetVariableRequest) returns (GetVariableResponse);
  rpc ListVariables(ListVariablesRequest) returns (ListVariablesResponse);
  rpc SetVariable(SetVariableRequest) returns (SetVariableResponse);
  rpc DeleteVariable(DeleteVariableRequest) returns (google.protobuf.Empty);
  rpc GetGlobal(GetGlobalRequest) returns (GetGlobalResponse);
  rpc ListGlobals(ListGlobalsRequest) returns (ListGlobalsResponse);
  rpc SetGlobal(SetGlobalRequest) returns (google.protobuf.Empty);
  rpc DeleteGlobal(DeleteGlobalRequest) returns (google.protobuf.Empty);

  // Semagroup
  rpc GetSemagroupMin(SemagroupRequest) returns (SemagroupKeyValueResponse);
  rpc GetSemagroupMax(SemagroupRequest) returns (SemagroupKeyValueResponse);
  rpc DiffSemagroupMin(SemagroupRequest) returns (SemagroupDiffResponse);
  rpc DiffSemagroupMax(SemagroupRequest) returns (SemagroupDiffResponse);
  rpc IncrementSemagroup(SemagroupRequest) returns (SemagroupKeyValueResponse);
  rpc DecrementSemagroup(SemagroupRequest) returns (SemagroupKeyValueResponse);

  // Queue：跨集群应用间消息队列（全局命名空间，无 app 归属）
  rpc PushQueue(PushQueueRequest) returns (PushQueueResponse);
  rpc PullQueue(PullQueueRequest) returns (PullQueueResponse);
  rpc PeekQueue(PeekQueueRequest) returns (PeekQueueResponse);
  rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse);
  rpc PurgeQueue(PurgeQueueRequest) returns (PurgeQueueResponse);
}

// ===== Semaphore Messages =====

message GetSemaphoreRequest { int32 app_id = 1; string name = 2; }
message GetSemaphoreResponse { string name = 1; int32 value = 2; int32 value0 = 3; }
message ListSemaphoresRequest { int32 app_id = 1; string prefix = 2; bool leaf_only = 3; int64 vtask_id = 4; }
message ListSemaphoresResponse {
  message Node { string name = 1; int32 value = 2; int32 value0 = 3; bool is_leaf = 5; int32 child_count = 6; int64 vtask = 7; google.protobuf.Timestamp t = 8; int32 id = 9; int32 app = 10; }
  repeated Node nodes = 1;
}
message CreateSemaphoreRequest { int32 app_id = 1; string name = 2; int32 value = 3; string conflict_action = 4; }
message CreateSemaphoreResponse { string name = 1; int32 value = 2; }
message UpdateSemaphoreRequest { int32 app_id = 1; string name = 2; int32 delta = 3; }
message UpdateSemaphoreResponse { string name = 1; int32 value = 2; }
message DeleteSemaphoreRequest { int32 app_id = 1; string name = 2; }

// ===== Variable Messages =====

message GetVariableRequest { int32 app_id = 1; string name = 2; }
message GetVariableResponse { string name = 1; string value = 2; }
message ListVariablesRequest { int32 app_id = 1; string prefix = 2; bool leaf_only = 3; int64 vtask_id = 4; }
message ListVariablesResponse {
  message Node { string name = 1; string value = 2; bool is_leaf = 4; int32 child_count = 5; int64 vtask = 6; google.protobuf.Timestamp t = 7; int32 id = 8; int32 app = 9; }
  repeated Node nodes = 1;
}
message SetVariableRequest { int32 app_id = 1; string name = 2; string value = 3; }
message SetVariableResponse { string name = 1; string value = 2; }
message DeleteVariableRequest { int32 app_id = 1; string name = 2; }

// ===== Global Messages =====

message GetGlobalRequest { string name = 1; }
message GetGlobalResponse { string name = 1; string value = 2; }
message KeyValue { string key = 1; string value = 2; google.protobuf.Timestamp t = 3; }
message ListGlobalsRequest { string prefix = 1; bool leaf_only = 2; }
message ListGlobalsResponse { repeated KeyValue globals = 1; }
message SetGlobalRequest { string name = 1; string value = 2; }
message DeleteGlobalRequest { string name = 1; }

// ===== Semagroup Messages =====

message SemagroupRequest { int32 app_id = 1; string sema_expr = 2; }
message SemagroupKeyValueResponse { string name = 1; int32 value = 2; }
message SemagroupDiffResponse { int32 value = 1; }

// ===== Queue Messages =====
// 出队顺序：priority DESC, id ASC（数值大者先出，同级先入先出）
// cluster 非空时由本地 controld 解析远端地址并转发（CLI 只连本地）。

message QueueMessage {
  int64 id = 1;
  string name = 2;
  int32 priority = 3;
  string body = 4;
  map<string, string> headers = 5;
  google.protobuf.Timestamp created_at = 6;
}
message PushQueueRequest {
  string name = 1;
  string body = 2;
  int32 priority = 3;
  map<string, string> headers = 4;
  string cluster = 5;
}
message PushQueueResponse { int64 id = 1; }
message PullQueueRequest { string name = 1; int32 count = 2; string cluster = 3; }
message PullQueueResponse { repeated QueueMessage messages = 1; }
message PeekQueueRequest { string name = 1; int32 count = 2; string cluster = 3; }
message PeekQueueResponse { repeated QueueMessage messages = 1; }
message ListQueuesRequest { string prefix = 1; string cluster = 2; }
message ListQueuesResponse {
  message QueueInfo {
    string name = 1;
    int64 count = 2;
    google.protobuf.Timestamp oldest_at = 3;
  }
  repeated QueueInfo queues = 1;
}
message PurgeQueueRequest { string name = 1; string cluster = 2; }
message PurgeQueueResponse { int64 deleted = 1; }
