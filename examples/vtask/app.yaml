name: vtask.examples
cluster: ${CLUSTER}
parameters:
  main_router: main-router

modules:
  wait-queue:
    base_image: scalebox.net/platform/wait-queue
    arguments:
      slot_options: slot_on_head
    parameters:
      # 避免提早分配资源，使得vtask在wait-queue中
      vtask_size: 1
    environments:
      - VTASK_MODE=${VTASK_MODE}

  vtask-head:
    arguments:
      slot_options: reserved_on_exit
    parameters:
      task_dist_mode: ${TASK_DIST_MODE}
      vtask_role: head
      vtask_size: 2
      # HOST-BOUND：与 vtask-core 相同，用于推导 to_host（同节点路由）；
      # GROUP-BOUND：head 是 SLOT-BOUND，head→core 由脚本显式 to_host 决定，
      # 来源非 HOST-BOUND 时 pod_id 不触发
      pod_id: ${POD_ID}
    slots:
      - ${HEAD_SLOTS}

  vtask-core:
    arguments:
      code_path: ${PWD}/vtask-core
    parameters:
      task_dist_mode: ${CORE_MODE}
      vtask_role: core
      # HOST-BOUND：与 vtask-head 相同，显式 to_host/to_ip 缺省时自动路由回来源节点；
      # GROUP-BOUND：多个 core 模块（均为 HOST-BOUND）之间靠相同 pod_id 保持同节点
      pod_id: ${POD_ID}
    environments:
      - RUNNING_SECONDS=${RUNNING_SECONDS}
    slots:
      - ${CORE_SLOTS}

  vtask-tail:
    arguments:
      slot_options: slot_on_head
    parameters:
      vtask_role: tail

  main-router:
    arguments:
      code_path: ${PWD}/main-router
      slot_options: slot_on_head
    environments:
      - VTASK_MODE=${VTASK_MODE}
