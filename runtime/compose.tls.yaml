# compose.tls.yaml — gRPC + PostgreSQL TLS 加密层
# 用法: docker compose -f compose.yaml -f compose.security.yaml -f compose.tls.yaml --project-name runtime up -d

services:
  controld:
    environment:
      # gRPC TLS（服务端）
      - GRPC_TLS_ENABLED=true
      # PG TLS（客户端，调试模式）
      - PG_SSLMODE=require
      - PG_PASSWORD=changeme
    volumes:
      # gRPC TLS
      - /etc/scalebox/tls/server.crt:/etc/scalebox/tls/server.crt:ro
      - /etc/scalebox/tls/server.key:/etc/scalebox/tls/server.key:ro
    # 覆盖 healthcheck：不加 TLS 时 grpc_health_probe 被服务端拒绝连接
    # 改用简单 TCP 检测（/dev/tcp 是 bash 内置功能）
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  actuator:
    environment:
      # gRPC TLS（客户端，验证 controld 证书）
      - GRPC_TLS_ENABLED=true

  database:
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/scalebox/tls/pg-server.crt
      -c ssl_key_file=/etc/scalebox/tls/pg-server.key
    volumes:
      - /etc/scalebox/tls/pg-server.crt:/etc/scalebox/tls/pg-server.crt:ro
      - /etc/scalebox/tls/pg-server.key:/etc/scalebox/tls/pg-server.key:ro
