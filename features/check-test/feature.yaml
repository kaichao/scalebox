name: check-test.features
cluster: ${CLUSTER}

modules:
  check_test:
    base_image: scalebox.net/platform/agent:latest
    parameters:
      start_task: ANY
    arguments:
      code_path: ${PWD}/code
      slot_options: slot_on_head
      dir_quota_gb: ${DIR_QUOTA_GB}
      free_space_gb: ${FREE_SPACE_GB}
    environments:
      - ACTION_CHECK=${ACTION_CHECK}
