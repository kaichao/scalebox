name: agent-interface-files.features
cluster: local

parameters:
  main_router: mr-module

modules:
  mr-module:
    base_image: scalebox.net/platform/agent:latest
    arguments:
      code_path: ${PWD}/mr-code
      slot_options: slot_on_head
  my-module:
    base_image: scalebox.net/platform/agent:latest
    arguments:
      code_path: ${PWD}/code
      slot_options: slot_on_head
    # sink-tasks.txt 前 4 种格式省略模块名，依赖 SINK_MODULE
    sink_modules:
      - mr-module
