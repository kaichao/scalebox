name: pod.features
cluster: ${CLUSTER}
parameters:
  main_router: router
modules:
  mod-1:
    base_image: scalebox.net/platform/agent:latest
    parameters:
      task_dist_mode: HOST-BOUND
      pod_id: my_pod
    slots:
      - n0-[01]
    # 默认 run.sh 按 SINK_MODULE 回流；回流到 router 后由它投给 mod-2
    sink_modules:
      - router
  mod-2:
    base_image: scalebox.net/platform/agent:latest
    parameters:
      task_dist_mode: HOST-BOUND
      pod_id: my_pod
    slots: 
      - n0-[01]
  router:
    base_image: scalebox.net/platform/agent:latest
    arguments:
      code_path: ${PWD}/router-code
      slot_options: slot_on_head
  
