name: slot-expr.features
cluster: local
modules:
  mod-slot-expr:
    base_image: scalebox.net/platform/agent:latest
    command: 'docker run -d --network=host -e SEQ=((@seq)) -e MY_PARAM=((@p:my_param)) -e MY_VAR=((@v:my_var)) --rm {{ENVS}} {{VOLUMES}} {{IMAGE}}'
    arguments:
      code_path: ${PWD}/code
      slot_options: slot_on_head
