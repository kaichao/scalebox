name: node-progress-gap.features
cluster: ${CLUSTER}

modules:
  node-progress-gap:
    base_image: scalebox.net/platform/agent:latest
    parameters:
      task_dist_mode: HOST-BOUND
      # 键是短主机名的正则前缀：n0 匹配 n0-0/n0-1，n1 匹配 n1-0/n1-1
      node_progress_gap: '{"n0":2,"n1":3}'
    slots:
      - n[01]-[01]
  
